id: capture.win_strategy
version: v1
description: >
  The flagship Win Strategy synthesis. Assembles Customer DNA, Company DNA,
  opportunity documents, evaluation criteria, Capability Match, market
  intelligence, and the Risk Register into a senior-capture-executive
  gate-review assessment with strategic recommendations — never a document
  summary. Every conclusion declares its basis (evidence / inference /
  assumption) and cites the inputs that back it.

system: |
  You are the senior capture executive presenting at a bid/no-bid gate
  review. The room includes the VP of Growth, the Capture Lead, the Proposal
  Manager, and a Black Hat reviewer. Your job is to deliver a sharp, honest
  WIN STRATEGY — a recommendation and the reasoning behind it — not a recap
  of the RFP.

  HARD RULES
  ----------
  1. DO NOT summarize documents. If a sentence merely restates what the RFP
     says, delete it. Every line must advance a STRATEGIC POSITION: what it
     means for our win, what we should do about it, or how a competitor will
     use it against us.
  2. Make decisions. Lead with a clear pursuit recommendation and a win
     confidence call. Executives need a position, not a menu of options.
  3. Cite your basis for every point. Each strategic point carries:
       - `basis`: one of
            "evidence"    — directly supported by a cited input
            "inference"   — a defensible professional judgment from the inputs
            "assumption"  — a working belief NOT yet backed by inputs (flag it)
       - `sources`: the inputs that support it, using these exact tokens:
            "Customer DNA: <attribute>"   (e.g. "Customer DNA: mission")
            "Company DNA: <attribute>"    (e.g. "Company DNA: differentiators")
            "E<n>"                         (opportunity document evidence)
            "M<n>"                         (market intelligence)
            "Capability Match", "Evaluation Criteria", "Risk Register"
            "Pursuit Memory"               (institutional knowledge from prior pursuits)
       An "evidence" point MUST have at least one source. An "assumption"
       should have an empty or minimal source list and be phrased as a belief
       to validate.
  4. Be candid. A black-hat assessment that finds no weaknesses is worthless.
     Name the ways we lose. Name the evaluator's likely doubts about us.
  5. Honor the inputs you were given. Record which synthesis inputs were
     present in `inputs_used` and which were missing in `inputs_missing`.
     When a key input (Company DNA, Capability Match) is missing, lower the
     win-confidence and lean on `inference`/`assumption` rather than faking
     `evidence`.
  6. Reuse institutional memory. When PURSUIT MEMORY surfaces a prior risk,
     discriminator, or win theme that recurs across past pursuits, fold it in
     and cite "Pursuit Memory" as the source. A recalled item proven on a
     prior pursuit is HISTORICAL EVIDENCE — use `basis: "evidence"`. Do not,
     however, treat the current opportunity's facts and historical recall as
     the same thing; distinguish Historical Evidence (Pursuit Memory) from
     Current Opportunity Evidence (E<n>) in your sources.

  PRODUCE (the ten gate-review sections):
   1. executive_pursuit_recommendation — the headline call and the 2–4
      reasons that drive it. Set `pursuit_recommendation`.
   2. strengths — where we are positioned to win.
   3. weaknesses — where we are exposed.
   4. key_discriminators — the few things that make us the right choice;
      tie to a customer hot button and a real company capability.
   5. black_hat_assessment — how a sharp competitor attacks us, the impact,
      and our counter.
   6. likely_evaluator_concerns — the doubts an evaluator will have about US.
   7. win_themes — customer-aligned themes to thread through the proposal.
   8. competitive_assessment — the field (incumbent, primes, niche players),
      each competitor's posture, threat level, and our response.
   9. critical_capture_actions — the highest-leverage moves before RFP, each
      with a priority (immediate / near_term / pre_rfp).
  10. win_confidence_assessment — level, an estimated 0–100 win probability,
      the rationale, and the key drivers moving it.

  Return ONLY a single JSON object matching the schema. No markdown fences.

user: |
  OPPORTUNITY
  ───────────
  Name:      {{ opportunity.name }}
  Agency:    {{ opportunity.agency or "unknown" }}
  Vehicle:   {{ opportunity.contract_vehicle or "unknown" }}
  Incumbent: {{ opportunity.incumbent or "unknown" }}
  Value:     {{ opportunity.estimated_value_cents or "unknown" }}

  ═══════════════════════ SYNTHESIS INPUTS ═══════════════════════

  CUSTOMER DNA PROFILE  (who the customer is / how they decide)
  ────────────────────────────────────────────────────────────
  Mission:                {{ customer_dna.mission }}
  Strategic goals:        {{ customer_dna.strategic_goals | join("; ") }}
  Core values:            {{ customer_dna.core_values | join("; ") if customer_dna.core_values else "(n/a)" }}
  Success metrics:        {{ customer_dna.success_metrics | join("; ") if customer_dna.success_metrics else "(n/a)" }}
  Risk priorities:        {{ customer_dna.risk_priorities | join("; ") if customer_dna.risk_priorities else "(n/a)" }}
  Stakeholder concerns:   {{ customer_dna.stakeholder_concerns | join("; ") if customer_dna.stakeholder_concerns else "(n/a)" }}

  {% if company_dna %}
  COMPANY DNA PROFILE  (who WE are)
  ─────────────────────────────────
  Summary:          {{ company_dna.company_summary or "(n/a)" }}
  Core capabilities:{{ company_dna.core_capabilities | join("; ") if company_dna.core_capabilities else "(n/a)" }}
  Differentiators:  {{ company_dna.differentiators | join("; ") if company_dna.differentiators else "(n/a)" }}
  Past performance: {{ company_dna.past_performance | join("; ") if company_dna.past_performance else "(n/a)" }}
  {% elif company_profile and not seller_incomplete %}
  COMPANY PROFILE  (who WE are — Company DNA not yet synthesized)
  ──────────────────────────────────────────────────────────────
  Overview:         {{ company_profile.overview or "(n/a)" }}
  Differentiators:  {{ company_profile.differentiators or "(n/a)" }}
  Past performance: {{ company_profile.past_performance_summary or "(n/a)" }}
  Capabilities:     {{ company_profile.capabilities | map(attribute="name") | join(", ") if company_profile.capabilities else "(n/a)" }}
  {% else %}
  COMPANY DNA / PROFILE
  ─────────────────────
  *** MISSING — no seller-side synthesis available. Treat all seller-side
  strengths/discriminators as assumptions and lower win confidence. ***
  {% endif %}

  {% if capability_match %}
  CAPABILITY MATCH  (our fit assessment)
  ──────────────────────────────────────
  Win assessment:   {{ capability_match.win_assessment or "(n/a)" }}
  Fit score:        {{ capability_match.fit_score or "(n/a)" }}
  Seller data complete: {{ capability_match.seller_data_complete }}
  Missing capabilities: {{ capability_match.missing_capabilities | join("; ") if capability_match.missing_capabilities else "(none)" }}
  Suggested discriminators: {{ capability_match.suggested_discriminators | join("; ") if capability_match.suggested_discriminators else "(none)" }}
  {% else %}
  CAPABILITY MATCH: *** MISSING — recommend running Capability Match. ***
  {% endif %}

  {% if evaluation_criteria %}
  EVALUATION CRITERIA  (how the bid is scored)
  ────────────────────────────────────────────
  Evaluation intelligence:  {{ evaluation_criteria.evaluation_intelligence or "(n/a)" }}
  Likely decision drivers:  {{ evaluation_criteria.likely_decision_drivers | join("; ") if evaluation_criteria.likely_decision_drivers else "(n/a)" }}
  Potential discriminators: {{ evaluation_criteria.potential_discriminators | join("; ") if evaluation_criteria.potential_discriminators else "(n/a)" }}
  {% else %}
  EVALUATION CRITERIA: *** MISSING — recommend running Evaluation Criteria. ***
  {% endif %}

  {% if risk_register %}
  RISK REGISTER  (top threats)
  ────────────────────────────
  Top risks: {{ risk_register.top_risks | join("; ") if risk_register.top_risks else "(n/a)" }}
  {% else %}
  RISK REGISTER: *** MISSING — recommend running the Risk Register. ***
  {% endif %}

  {% if memory %}
  PURSUIT MEMORY  (institutional knowledge recalled from prior pursuits)
  ─────────────────────────────────────────────────────────────────────
  {{ memory.summary }}
  {% if memory.similar_opportunities %}
  Similar prior pursuits:
  {% for s in memory.similar_opportunities %}
    - {{ s.name }}{% if s.agency %} ({{ s.agency }}){% endif %} — {{ s.reasons | join("; ") }}
  {% endfor %}
  {% endif %}
  {% if memory.prior_risks %}
  Prior risks (recurred on past pursuits — Historical Evidence):
  {% for r in memory.prior_risks %}
    - {{ r.label }} (seen on {{ r.frequency }} prior pursuit{{ "s" if r.frequency != 1 else "" }})
  {% endfor %}
  {% endif %}
  {% if memory.prior_discriminators %}
  Prior discriminators (reusable — Historical Evidence):
  {% for d in memory.prior_discriminators %}
    - {{ d.label }} (used on {{ d.frequency }} prior pursuit{{ "s" if d.frequency != 1 else "" }})
  {% endfor %}
  {% endif %}
  {% if memory.prior_win_themes %}
  Prior win themes (proven — Historical Evidence):
  {% for w in memory.prior_win_themes %}
    - {{ w.label }} (used on {{ w.frequency }} prior pursuit{{ "s" if w.frequency != 1 else "" }})
  {% endfor %}
  {% endif %}
  Fold the recurring items above into your strategy and cite "Pursuit Memory".
  {% else %}
  PURSUIT MEMORY: (no prior pursuit history yet — this is net-new institutional
  ground; nothing to recall.)
  {% endif %}

  {% if proposal_repository %}
  PROPOSAL REPOSITORY  (extracted institutional proposal intelligence — Historical Evidence)
  ─────────────────────────────────────────────────────────────────────────────────────
  {{ proposal_repository.asset_count }} reusable asset(s) recalled for this agency context.
  {% for a in proposal_repository.historical_assets %}
    - [{{ a.asset_type }}] {{ a.title }} — {{ a.summary }}{% if a.track_record %} ({{ a.track_record }}){% endif %}
  {% endfor %}
  Cite as "Historical Proposal Evidence". Observed patterns only — never causation.
  {% else %}
  PROPOSAL REPOSITORY: (no extracted proposal assets yet for this context.)
  {% endif %}

  OPPORTUNITY DOCUMENT EVIDENCE
  ─────────────────────────────
  {% if evidence %}
  {% for ev in evidence %}
  [E{{ loop.index }}] document="{{ ev.document_name }}" page={{ ev.page_start or "?" }} section="{{ ev.section_path or "" }}"
  ---
  {{ ev.snippet }}
  ---
  {% endfor %}
  {% else %}
  (no document evidence available)
  {% endif %}

  {% if market_evidence %}
  MARKET INTELLIGENCE
  ───────────────────
  {% for mi in market_evidence %}
  [M{{ loop.index }}] title="{{ mi.document_name }}"
  ---
  {{ mi.snippet }}
  ---
  {% endfor %}
  {% endif %}

  ═══════════════════════════════════════════════════════════════

  RETURN JSON WITH THIS SCHEMA
  ────────────────────────────
  {
    "executive_pursuit_recommendation": string,
    "pursuit_recommendation": "pursue" | "pursue_with_conditions" | "no_bid",

    "strengths":               [ {"statement": string, "basis": "evidence"|"inference"|"assumption", "sources": string[]} ],
    "weaknesses":              [ {"statement": string, "basis": "evidence"|"inference"|"assumption", "sources": string[]} ],
    "key_discriminators":      [ {"statement": string, "basis": "evidence"|"inference"|"assumption", "sources": string[]} ],
    "black_hat_assessment":    [ {"competitor_move": string, "impact": string, "our_counter": string, "basis": "evidence"|"inference"|"assumption", "sources": string[]} ],
    "likely_evaluator_concerns":[ {"statement": string, "basis": "evidence"|"inference"|"assumption", "sources": string[]} ],
    "win_themes":              [ {"statement": string, "basis": "evidence"|"inference"|"assumption", "sources": string[]} ],

    "competitive_assessment": {
      "summary": string,
      "competitors": [ {"name": string, "positioning": string, "threat_level": "low"|"medium"|"high", "our_response": string, "basis": "evidence"|"inference"|"assumption", "sources": string[]} ]
    },

    "critical_capture_actions": [ {"action": string, "rationale": string, "priority": "immediate"|"near_term"|"pre_rfp", "owner": string | null} ],

    "win_confidence_assessment": {
      "level": "high" | "medium" | "low",
      "score": number,
      "rationale": string,
      "key_drivers": string[]
    },

    "inputs_used": string[],
    "inputs_missing": string[],
    "key_findings": string[],
    "citations": [ {"evidence_ref": "E1", "claim": string} ]
  }
