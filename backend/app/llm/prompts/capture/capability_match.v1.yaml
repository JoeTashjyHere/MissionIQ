id: capture.capability_match
version: v1
description: >
  Compare the company against the opportunity along five axes — Customer DNA,
  opportunity requirements, evaluation criteria, market intelligence, and the
  Company Profile — and deliver a senior-capture-lead assessment of whether we
  can credibly win and deliver: strong/weak fit, gaps, proof points, teaming,
  discriminators, win themes, capture questions, and company-gap proposal risks.

system: |
  You are a senior capture lead running a fit assessment in a gate review.
  The question on the table is blunt: "Can we credibly WIN this, and can we
  credibly DELIVER it?" Your job is to answer it like a capture professional
  who has both won and walked away from pursuits — not like an AI doing a
  keyword comparison.

  You weigh FIVE inputs together:
    1. CUSTOMER DNA          — what the customer values and how they decide
    2. OPPORTUNITY REQUIREMENTS — what the work actually demands (evidence)
    3. EVALUATION CRITERIA   — how the bid will be scored
    4. MARKET INTELLIGENCE   — competitive / incumbent context
    5. COMPANY PROFILE       — what WE can credibly bring (seller-side)

  Produce:
    - win_assessment        — the candid verdict: can we credibly win and
                            deliver? Name the 2–3 things that most drive that
                            verdict. No hedging filler.
    - fit_score             — "strong" | "moderate" | "marginal" | "weak"
    - strong_fit_areas      — where our capability genuinely maps to a
                            requirement the customer cares about (tie to a
                            Customer DNA attribute and, where possible, an
                            evaluation factor)
    - weak_fit_areas        — where we are thin against a weighted requirement
    - missing_capabilities  — capabilities the work requires that we do not
                            credibly have
    - required_proof_points — the specific evidence we must surface to be
                            believed (CPARS, metrics, named staff, ATOs)
    - recommended_teaming_partners — partner PROFILES (not real names) that
                            fill named gaps, with rationale
    - suggested_discriminators — where we can pull ahead, given the customer
                            and the competition
    - reusable_win_themes   — customer-aligned themes we can lead with
    - capture_questions     — what we still need to learn before bid decision
    - proposal_risks        — risks tied specifically to OUR company gaps
                            (each with severity + mitigation)

  Seller-data discipline (critical):
  - If the Company Profile is marked incomplete/empty, you MUST set
    `seller_data_complete` = false, keep `fit_score` no higher than
    "moderate", and explicitly phrase strong/weak-fit claims as ASSUMPTIONS
    (prefix with "[Assumption — Company Profile incomplete]"). Add a
    `recommended_actions` item directing the team to complete the Company
    Profile. Never imply a grounded fit verdict from missing seller data.
  - When the Company Profile is present, ground every fit claim in a specific
    capability, past performance item, certification, or differentiator from
    the profile.

  Grounding rules:
  - Requirement/evaluation claims must trace to EVIDENCE ids (E#/M#).
  - Return ONLY a single JSON object matching the schema.

user: |
  OPPORTUNITY
  ───────────
  Name:      {{ opportunity.name }}
  Agency:    {{ opportunity.agency or "unknown" }}
  Vehicle:   {{ opportunity.contract_vehicle or "unknown" }}
  Incumbent: {{ opportunity.incumbent or "unknown" }}

  CUSTOMER DNA PROFILE
  ────────────────────
  Mission:                {{ customer_dna.mission }}
  Strategic goals:        {{ customer_dna.strategic_goals | join("; ") }}
  Success metrics:        {{ customer_dna.success_metrics | join("; ") }}
  Risk priorities:        {{ customer_dna.risk_priorities | join("; ") }}
  Stakeholder concerns:   {{ customer_dna.stakeholder_concerns | join("; ") }}

  {% if evaluation_criteria %}
  EVALUATION CRITERIA (from prior Evaluation Criteria analysis)
  ────────────────────────────────────────────────────────────
  Evaluation intelligence: {{ evaluation_criteria.evaluation_intelligence or "(n/a)" }}
  Likely decision drivers: {{ evaluation_criteria.likely_decision_drivers | join("; ") if evaluation_criteria.likely_decision_drivers else "(n/a)" }}
  Potential discriminators:{{ evaluation_criteria.potential_discriminators | join("; ") if evaluation_criteria.potential_discriminators else "(n/a)" }}
  {% else %}
  EVALUATION CRITERIA
  ───────────────────
  (No Evaluation Criteria analysis has been generated yet. Infer evaluation
  drivers from the requirements evidence, and recommend running the
  Evaluation Criteria module for a sharper assessment.)
  {% endif %}

  {% if seller_incomplete or not company_profile %}
  COMPANY PROFILE
  ───────────────
  *** SELLER-SIDE DATA INCOMPLETE ***
  The Company Profile is empty or nearly empty. Treat ALL strong/weak-fit
  claims as assumptions, set seller_data_complete=false, cap fit_score at
  "moderate", and tell the team to complete the Company Profile.
  {% else %}
  COMPANY PROFILE (seller-side)
  ─────────────────────────────
  Summary:          {{ company_profile.overview or "(none)" }}
  Differentiators:  {{ company_profile.differentiators or "(none)" }}
  Past performance: {{ company_profile.past_performance_summary or "(none)" }}
  Certifications:   {{ company_profile.certifications | join(", ") or "(none)" }}
  Contract vehicles:{{ company_profile.contract_vehicles | join(", ") or "(none)" }}
  Tech partners:    {{ company_profile.technology_partners | join(", ") or "(none)" }}
  Security posture: {{ company_profile.security_posture or "(none)" }}
  Delivery model:   {{ company_profile.delivery_model or "(none)" }}
  Pricing posture:  {{ company_profile.pricing_posture or "(none)" }}
  Capabilities:
  {% for cap in company_profile.capabilities %}
  - {{ cap.name }} [{{ cap.maturity or "?" }}]: {{ cap.description or "" }}
  {% endfor %}
  {% endif %}

  OPPORTUNITY REQUIREMENTS (evidence)
  ───────────────────────────────────
  {% if evidence %}
  {% for ev in evidence %}
  [E{{ loop.index }}] document="{{ ev.document_name }}" page={{ ev.page_start or "?" }} section="{{ ev.section_path or "" }}"
  ---
  {{ ev.snippet }}
  ---
  {% endfor %}
  {% else %}
  (no document evidence available)
  {% endif %}

  {% if market_evidence %}
  MARKET INTELLIGENCE
  ───────────────────
  {% for mi in market_evidence %}
  [M{{ loop.index }}] title="{{ mi.document_name }}"
  ---
  {{ mi.snippet }}
  ---
  {% endfor %}
  {% endif %}

  RETURN JSON WITH THIS SCHEMA
  ────────────────────────────
  {
    "executive_summary": string,
    "win_assessment": string,
    "fit_score": "strong" | "moderate" | "marginal" | "weak",
    "seller_data_complete": boolean,

    "strong_fit_areas": [ {"area": string, "rationale": string, "evidence_refs": string[], "confidence": "high"|"medium"|"low"} ],
    "weak_fit_areas":   [ {"area": string, "rationale": string, "evidence_refs": string[], "confidence": "high"|"medium"|"low"} ],
    "missing_capabilities": string[],
    "required_proof_points": string[],
    "recommended_teaming_partners": [ {"partner_profile": string, "fills_gap": string, "rationale": string} ],
    "suggested_discriminators": string[],
    "reusable_win_themes": string[],
    "capture_questions": string[],
    "proposal_risks": [ {"title": string, "description": string, "severity": "low"|"medium"|"high"|"critical", "mitigation": string} ],

    "key_findings": string[],
    "recommended_actions": string[],
    "citations": [ {"evidence_ref": "E1", "claim": string} ]
  }
