[project]
name = "missioniq-backend"
version = "0.1.0"
description = "MissionIQ — Operational Intelligence Platform (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "python-multipart>=0.0.20,<1.0",
    "email-validator>=2.2,<3.0",
    "sqlalchemy[asyncio]>=2.0.35,<3.0",
    "asyncpg>=0.30,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pgvector>=0.3.6,<1.0",
    "alembic>=1.14,<2.0",
    "argon2-cffi>=23.1,<25.0",
    "pyjwt>=2.10,<3.0",
    "cryptography>=43.0,<46.0",
    "httpx>=0.28,<1.0",
    "pypdf>=5.1,<6.0",
    "python-docx>=1.1,<2.0",
    "tiktoken>=0.8,<1.0",
    "structlog>=24.4,<26.0",
    "pyyaml>=6.0,<7.0",
    "jinja2>=3.1,<4.0",
]

[project.optional-dependencies]
openai = ["openai>=1.55,<2.0"]
anthropic = ["anthropic>=0.40,<1.0"]
bedrock = ["boto3>=1.35,<2.0"]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<7.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
]
all = [
    "missioniq-backend[openai,anthropic,bedrock,dev]",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "seeds*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
